name: Build TakeoffWorks EXE Direct

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          
      - name: Download PDFium
        run: |
          curl -L -o pdfium.zip https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/6244/pdfium-windows-x64.zip
          tar -xf pdfium.zip
          echo "PDFium downloaded"

      - name: Create Project Files and Build EXE
        shell: pwsh
        run: |
          # 1. Create CMakeLists.txt manually
          @"
          cmake_minimum_required(VERSION 3.20)
          project(TakeoffWorks_Native LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_AUTOMOC ON)
          find_package(Qt6 REQUIRED COMPONENTS Core Widgets Gui)
          set(PDFium_DIR "${{ github.workspace }}/pdfium")
          find_library(PDFium_LIBRARY NAMES pdfium PATHS ${{ github.workspace }}/pdfium NO_DEFAULT_PATH)
          find_path(PDFium_INCLUDE_DIR NAMES fpdfview.h PATHS ${{ github.workspace }}/pdfium/include NO_DEFAULT_PATH)
          add_executable(TakeoffWorks_Native main.cpp)
          target_link_libraries(TakeoffWorks_Native Qt6::Core Qt6::Gui Qt6::Widgets ${PDFium_LIBRARY})
          target_include_directories(TakeoffWorks_Native PRIVATE ${PDFium_INCLUDE_DIR})
          if(WIN32)
              add_custom_command(TARGET TakeoffWorks_Native POST_BUILD COMMAND cmake -E copy_if_downloaded ${{ github.workspace }}/pdfium/pdfium.dll $<TARGET_FILE_DIR:TakeoffWorks_Native>)
          endif()
          "@ > CMakeLists.txt

          # 2. Create main.cpp manually
          @"
          #include <QApplication>
          #include <QMainWindow>
          #include <QLabel>
          #include <QPushButton>
          #include <QVBoxLayout>
          #include <QMessageBox>
          #include <QFileDialog>
          
          class MainWindow : public QMainWindow {
          public:
              MainWindow() {
                  auto *btn = new QPushButton("Test PDFium Load", this);
                  setCentralWidget(btn);
                  connect(btn, &QPushButton::clicked, []() {
                      QMessageBox::information(nullptr, "Success", "TakeoffWorks Native is running!");
                  });
                  resize(400, 300);
              }
          };
          
          int main(int argc, char *argv[]) {
              QApplication app(argc, argv);
              MainWindow w;
              w.show();
              return app.exec();
          }
          "@ > main.cpp

          # 3. Build the project
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DPDFium_DIR="${{ github.workspace }}/pdfium" -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release
          
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TakeoffWorks-EXE-Final
          path: build/Release/TakeoffWorks_Native.exe
