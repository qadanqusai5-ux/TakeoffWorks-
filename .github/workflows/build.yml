name: Build TakeoffWorks Native

on: [push]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        dir: ${{ runner.temp }}/qt

    - name: Build and run tests
      run: |
        echo "Building TakeoffWorks Native..."
        # هذا الأمر سيولد برنامج صغير يفتح نافذة فقط، لنتأكد أن البيئة تعمل
        echo "#include <QApplication>\n#include <QLabel>\nint main(int argc, char *argv[]) { QApplication a(argc, argv); QLabel l(\"TakeoffWorks Native Ready!\"); l.show(); return a.exec(); }" > main.cpp
        $env:Path += ";${{ runner.temp }}/qt/6.11.1/msvc2019_64/bin"
        qmake -project "CONFIG += qt" "QT += widgets"
        qmake
        nmake
        echo "Build Complete!"

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TakeoffWorks-Native-EXE
        path: release/*.exe
