name:name: Build TakeoffWorks Native

on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
      
      - name: Download PDFium
        run: |
          curl -L -o pdfium.zip https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/6244/pdfium-windows-x64.zip
          mkdir deps
          tar -xf pdfium.zip -C deps
          dir deps
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DPDFium_DIR="${{ github.workspace }}\deps" -G "Visual Studio 17 2022" -A x64
      
      - name: Build EXE
        run: |
          cd build
          cmake --build . --config Release
      
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakeoffWorks-EXE
          path: build/Release/TakeoffWorks_Native.exerks_Native.exe
